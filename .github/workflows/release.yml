# SPDX-License-Identifier: Apache-2.0

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*-scatool.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          cache: false
          rustflags: ""

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: release-verify

      - name: Verify embedded license index
        uses: ./.github/actions/verify-embedded-license-index

      - name: Verify ScanCode output format version sync
        uses: ./.github/actions/verify-scancode-output-format-version

      - name: Verify release version sync
        run: ./scripts/check_release_version_sync.sh

      - name: Verify release tag matches crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-scatool\.[1-9][0-9]*$ ]]; then
            echo "Expected vX.Y.Z-scatool.N release tag" >&2
            exit 1
          fi
          # Keep the upstream crate version intact for an unchanged-source build.
          ./scripts/check_release_tag_sync.sh "${RELEASE_TAG%-scatool.*}"

      - name: Verify tagged commit is reachable from origin/main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check packaged crate size
        run: ./scripts/check_crate_size.sh

      - name: Verify crates.io package publish dry-run
        run: cargo publish --locked --dry-run -p provenant-cli

      - name: Install cargo-about
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-about@0.9.0

      - name: Generate third-party license disclosure
        run: ./scripts/generate_third_party_notices.sh THIRD-PARTY-NOTICES.md

      - name: Upload third-party license disclosure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries target musl and link statically, so a single artifact runs on
          # any glibc/musl distro (and in the distroless/static container). musl-tools
          # provides musl-gcc for the bundled-SQLite C build.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            asset_name: provenant-linux-x86_64

          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset_name: provenant-linux-aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          lfs: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          cache: false
          rustflags: ""
          target: ${{ matrix.target }}

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --assume-yes musl-tools

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: PROVENANT_BUILD_VERSION="${RELEASE_TAG#v}" cargo build --locked --release --bin provenant --target ${{ matrix.target }}

      - name: Set up Python for binary smoke test
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Smoke test release binary
        shell: bash
        env:
          BINARY_PATH: target/${{ matrix.target }}/release/provenant
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import tomllib

          binary = pathlib.Path(os.environ["BINARY_PATH"]).resolve()
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          actual_version = subprocess.check_output([str(binary), "--version"], text=True).splitlines()[0].strip()
          build_version = os.environ["RELEASE_TAG"].removeprefix("v")
          assert build_version.startswith(f"{version}-scatool."), build_version
          assert actual_version == f"provenant-cli {build_version}", actual_version

          with tempfile.TemporaryDirectory(prefix="provenant-release-") as directory:
              work = pathlib.Path(directory)
              root = work / "input"
              root.mkdir()
              (root / "LICENSE").write_text("SPDX-License-Identifier: MIT\n", encoding="utf-8")
              (root / "main.js").write_text(
                  "// SPDX-License-Identifier: Apache-2.0\n"
                  "// Copyright (c) 2024 Example Contributors\n",
                  encoding="utf-8",
              )
              (root / "Case.js").write_text("// SPDX-License-Identifier: MIT\n", encoding="utf-8")
              (root / "case.js").write_text("// SPDX-License-Identifier: Apache-2.0\n", encoding="utf-8")
              paths = work / "paths.txt"
              paths.write_text("LICENSE\nmain.js\nCase.js\ncase.js\n./Case.js\n", encoding="utf-8")
              output = work / "scan.json"
              subprocess.run([
                  str(binary), "scan", "--quiet", "--license", "--copyright",
                  "--license-text", "--license-references", "--compat-mode", "scancode",
                  "--paths-file", str(paths), "--cache-dir", str(work / "cache"),
                  "--json", str(output), str(root),
              ], check=True, timeout=120)
              data = json.loads(output.read_text(encoding="utf-8"))
              files = {pathlib.Path(f["path"]).name: f for f in data["files"] if f["type"] == "file"}
              assert set(files) == {"LICENSE", "main.js", "Case.js", "case.js"}, files.keys()
              assert files["LICENSE"]["detected_license_expression_spdx"] == "MIT"
              assert files["main.js"]["detected_license_expression_spdx"] == "Apache-2.0"
              assert files["Case.js"]["detected_license_expression_spdx"] == "MIT"
              assert files["case.js"]["detected_license_expression_spdx"] == "Apache-2.0"
              assert files["main.js"]["copyrights"], "Missing copyright detection"
              assert all(not h.get("errors") for h in data["headers"]), data["headers"]
              for entry in files.values():
                  assert not entry.get("scan_errors"), entry
                  assert any(
                      match.get("matched_text")
                      for detection in entry["license_detections"]
                      for match in detection["matches"]
                  ), "Missing matched license text"
              assert data["license_references"], "Missing license references"
          print(f"Verified {actual_version}: paths-file and ScanCode-compatible license/copyright output")
          PYTHON

      - name: Download third-party license disclosure
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          name: third-party-notices
          path: .

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/NOTICE" "$GITHUB_WORKSPACE/THIRD-PARTY-NOTICES.md" .
          tar czf ${{ matrix.asset_name }}.tar.gz provenant LICENSE NOTICE THIRD-PARTY-NOTICES.md
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz.sha256
          if-no-files-found: error

  create-release:
    name: Create Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release with all assets
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          allowUpdates: false
          artifacts: artifacts/*/*.tar.gz,artifacts/*/*.sha256
          artifactErrorsFailBuild: true
          body: |
            Scatool Linux binary build `${{ github.ref_name }}` from commit `${{ github.sha }}`.
            The binary reports the Scatool release version using upstream build-version support.
            Archives include license notices and SHA-256 checksums.
          generateReleaseNotes: false
          prerelease: ${{ contains(github.ref, '-') }}
